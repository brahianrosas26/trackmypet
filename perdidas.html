<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8f7ef">
  <title>Mascotas perdidas | TrackMyPet</title>
  <style>
    :root { --green:#169b5b; --deep:#133126; --mint:#e8f7ef; --rose:#fff1f2; --red:#cf3348; --muted:#69766f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17211d; background:radial-gradient(circle at 50% -10%,#fff 0,#e8f7ef 42%,#f7fcf9 100%); }
    main { width:min(100%,940px); margin:0 auto; padding:32px 20px 52px; }
    .brand { display:block; width:154px; margin:0 auto 28px; background:#fff; border-radius:999px; padding:11px 18px; box-shadow:0 10px 28px rgba(22,77,52,.10); }
    .hero { text-align:center; max-width:620px; margin:0 auto 28px; }
    .badge { display:inline-flex; gap:7px; align-items:center; padding:7px 11px; color:var(--red); background:var(--rose); border-radius:99px; font-size:13px; font-weight:800; letter-spacing:.01em; }
    .badge svg { width:16px; height:16px; }
    h1 { margin:14px 0 8px; color:var(--deep); font-size:clamp(30px,6vw,44px); line-height:1.05; letter-spacing:-.045em; }
    .hero p { margin:0; color:var(--muted); font-size:17px; line-height:1.5; }
    #status { min-height:22px; margin:18px 0 14px; text-align:center; color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    .grid.multiple { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .grid.multiple .card { min-height:270px; border-radius:18px; }
    .grid.multiple .photo { height:118px; }
    .grid.multiple .content { padding:13px; }
    .grid.multiple h2 { font-size:18px; }
    .grid.multiple .place,.grid.multiple .message { font-size:13px; }
    .grid.multiple .open { padding:11px 9px; font-size:13px; }
    .card { display:flex; flex-direction:column; overflow:hidden; min-height:314px; background:#fff; border:1px solid rgba(17,68,44,.08); border-radius:22px; box-shadow:0 14px 38px rgba(22,77,52,.11); }
    .photo { position:relative; height:170px; background:#dff1e7; overflow:hidden; }
    .photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo .fallback { width:100%; height:100%; display:grid; place-items:center; color:#5b896e; }
    .photo svg { width:54px; height:54px; }
    .content { display:flex; flex:1; flex-direction:column; padding:18px; }
    h2 { margin:0; font-size:23px; letter-spacing:-.03em; color:var(--deep); }
    .place { display:flex; align-items:center; gap:7px; min-height:23px; margin:8px 0 10px; color:#4f665a; font-size:14px; }
    .place svg { width:16px; height:16px; color:var(--green); flex:0 0 auto; }
    .message { display:-webkit-box; margin:0 0 18px; overflow:hidden; color:#52615a; font-size:14px; line-height:1.45; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
    .message:empty { display:none; }
    .open { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:auto; padding:12px 16px; border-radius:12px; color:#fff; background:var(--green); font-weight:800; text-decoration:none; }
    .open:hover { background:#0f874d; }
    .open svg { width:17px; height:17px; }
    .empty,.error { max-width:560px; margin:24px auto; padding:30px 24px; text-align:center; background:rgba(255,255,255,.78); border:1px solid rgba(22,77,52,.12); border-radius:20px; color:var(--muted); line-height:1.5; }
    .error { color:#a3293b; border-color:#f2c4cc; background:#fff7f8; }
    .skeleton { height:314px; border-radius:22px; background:linear-gradient(100deg,#fff 30%,#f2faf5 50%,#fff 70%); background-size:200% 100%; animation:shine 1.2s infinite; }
    footer { margin-top:36px; color:#7a8880; text-align:center; font-size:13px; }
    @keyframes shine { to { background-position:-200% 0; } }
    @media (max-width:540px) { main { padding:25px 16px 42px; } .brand { width:142px; margin-bottom:24px; } .card { min-height:300px; } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/logo.png" alt="trackmypet.uy">
    <section class="hero" aria-labelledby="title">
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.8 2.5 17.3A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.7L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg> Búsqueda activa</span>
      <h1 id="title">Mascotas perdidas</h1>
      <p>Ayudá a reunirlas con su familia. Abrí la ficha para ver cómo contactarte con sus responsables.</p>
    </section>
    <p id="status" role="status" aria-live="polite">Cargando mascotas...</p>
    <section id="list" class="grid" aria-label="Mascotas perdidas">
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
    </section>
    <footer>TrackMyPet · Identificación QR para mascotas</footer>
  </main>
  <script>
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const iconPin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
    const iconArrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
    const iconPet = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20c-2.4 0-6.5-2-6.5-5.4 0-1.7 1.1-3.1 2.7-3.4.8-2.2 2.4-3.4 3.8-3.4s3 1.2 3.8 3.4c1.6.3 2.7 1.7 2.7 3.4C18.5 18 14.4 20 12 20Z"/><path d="M8 5.6C7 3.8 8.2 2 9.6 2c1.6 0 1.9 1.9 1.2 3.5M16 5.6c1-1.8-.2-3.6-1.6-3.6-1.6 0-1.9 1.9-1.2 3.5"/></svg>';
    function esc(value) { const span = document.createElement('span'); span.textContent = value || ''; return span.innerHTML; }
    function card(pet) {
      const photo = pet.foto ? '<img src="' + esc(pet.foto) + '" alt="Foto de ' + esc(pet.nombre) + '" loading="lazy">' : '<div class="fallback">' + iconPet + '</div>';
      const place = pet.zona ? '<p class="place">' + iconPin + '<span>' + esc(pet.zona) + '</span></p>' : '<p class="place">' + iconPin + '<span>Zona no especificada</span></p>';
      const message = pet.mensaje ? '<p class="message">' + esc(pet.mensaje) + '</p>' : '<p class="message"></p>';
      return '<article class="card"><div class="photo">' + photo + '</div><div class="content"><h2>' + esc(pet.nombre) + '</h2>' + place + message + '<a class="open" href="/' + encodeURIComponent(pet.codigo) + '">Ver ficha de la mascota ' + iconArrow + '</a></div></article>';
    }
    async function load() {
      try {
        const response = await fetch('/api/lost-tags', { headers:{ Accept:'application/json' } });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'No se pudo cargar la información.');
        const pets = Array.isArray(payload.data) ? payload.data : [];
        if (!pets.length) {
          list.className = '';
          list.innerHTML = '<div class="empty">En este momento no hay mascotas reportadas como perdidas.</div>';
          status.textContent = '';
          return;
        }
        list.className = pets.length > 1 ? 'grid multiple' : 'grid';
        list.innerHTML = pets.map(card).join('');
        status.textContent = pets.length === 1 ? '1 mascota necesita ayuda' : pets.length + ' mascotas necesitan ayuda';
      } catch (error) {
        list.className = '';
        list.innerHTML = '<div class="error">' + esc(error.message) + '</div>';
        status.textContent = '';
      }
    }
    load();
  </script>
</body>
</html>
